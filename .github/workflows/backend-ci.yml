name: Backend CI
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run local:setup
      - run: docker compose --env-file backend/.env up -d --wait postgres
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run db:migrate:test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run test:integration
      - run: npm run build
      - run: npm --workspace backend run docs:generate
      - run: git diff --exit-code -- backend/docs/openapi.json
      - run: npm audit --audit-level=high
      - run: docker compose -f compose.smoke.yaml up --build -d --wait api
      - run: node scripts/smoke-api.mjs http://127.0.0.1:5087
      - name: Verify non-root runtime
        run: docker compose -f compose.smoke.yaml exec -T api node -e "if (process.getuid() === 0) process.exit(1)"
      - name: Stop smoke containers
        if: always()
        run: docker compose -f compose.smoke.yaml down
